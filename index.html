<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>時刻</title>
<!-- 検索エンジンに載せない（自分用のため） -->
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="時刻">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  /* 写真に撮って読み取るための時計。白地に黒の太字（文字読み取りに一番強い組み合わせ） */
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:#fff;
    color:#000;
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    font-variant-numeric:tabular-nums; /* 数字の幅をそろえて、表示がガタつかないように */
    -webkit-user-select:none;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }
  /* 文字の大きさは画面から自動計算する。
     左右はノッチ／ダイナミックアイランド（画面の切り欠き）の余白を「大きい方×2」引いた幅に収める。
     余白の値が回転などで変わっても、ブラウザが自動で計算し直す */
  :root{
    --sl:env(safe-area-inset-left,0px);
    --sr:env(safe-area-inset-right,0px);
    --st:env(safe-area-inset-top,0px);
    --sb:env(safe-area-inset-bottom,0px);
    --tw:4.6; /* 「00:00:00」の幅（文字の大きさ何個分か）。読み込み時に実測して上書き */
    --size:min(calc((100vw - 2 * max(var(--sl), var(--sr))) * 0.9 / var(--tw)),
               calc((100vh - var(--st) - var(--sb)) * 0.6));
  }
  #date{font-weight:700;letter-spacing:0.02em;line-height:1;font-size:calc(var(--size) * 0.28);margin-bottom:calc(var(--size) * 0.12);}
  #time{font-weight:800;line-height:1;white-space:nowrap;font-size:var(--size);}
  #hint{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 8px);left:0;right:0;text-align:center;
    font-size:13px;color:#888;}
</style>
</head>
<body>
<div id="date">0000-00-00</div>
<div id="time">00:00:00</div>
<div id="hint"></div>
<script>
(function(){
  var dateEl = document.getElementById('date');
  var timeEl = document.getElementById('time');
  var hintEl = document.getElementById('hint');

  function two(n){ return (n < 10 ? '0' : '') + n; }

  function draw(){
    var d = new Date();
    dateEl.textContent = d.getFullYear() + '-' + two(d.getMonth() + 1) + '-' + two(d.getDate());
    timeEl.textContent = two(d.getHours()) + ':' + two(d.getMinutes()) + ':' + two(d.getSeconds());
  }

  // 秒の変わり目ぴったりに書き換える（遅れて切り替わらないように）
  function tick(){
    draw();
    setTimeout(tick, 1000 - (Date.now() % 1000) + 2);
  }

  // 「00:00:00」の幅を実測して、文字の大きさの計算に使う（大きさそのものは CSS 側で計算）
  function measure(){
    timeEl.style.fontSize = '100px';
    document.documentElement.style.setProperty('--tw', (timeEl.scrollWidth / 100).toFixed(3));
    timeEl.style.fontSize = '';
  }

  // 画面が暗くならないようにする（対応している iPhone のみ）
  var lock = null;
  function keepAwake(){
    if(!('wakeLock' in navigator)){ hintEl.textContent = ''; return; }
    if(lock) return;
    navigator.wakeLock.request('screen').then(function(l){
      lock = l;
      hintEl.textContent = '';
      l.addEventListener('release', function(){ lock = null; });
    }).catch(function(){
      hintEl.textContent = 'タップすると画面が暗くならなくなります';
    });
  }
  document.addEventListener('click', keepAwake);
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible'){ draw(); keepAwake(); }
  });

  draw();
  measure();
  tick();
  keepAwake();

  if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
})();
</script>
</body>
</html>
